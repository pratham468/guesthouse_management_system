<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Signup - GrandStay</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    </head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <small>GUESTHOUSE MGMT</small>
            <h1>ACW Stay</h1>
        </div>
        
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Please enter your details to Signup</p>
        

        <div class="input-group">
            <label for="text">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="e.g. name@company.com">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <select id="role">
            <option value="employee">Employee</option>
            <option value="manager">Manager</option>
        </select>
        <br>
        <br>
        <button class="primary-btn" onclick="signup()">Signup</button>

        <p id="msg" class="error-msg"></p>

        <div class="auth-footer">
            <span>Already have an account?</span>
            <a href="login.html">Login</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
