<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GrandStay</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <small>GUESTHOUSE MGMT</small>
            <h1>ACW Stay</h1>
        </div>
        
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Please enter your details to login</p>
        <br>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="e.g. name@company.com">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="primary-btn" onclick="login()">Login to Portal</button>
        
        <p id="msg" class="error-msg"></p>

        <div class="auth-footer">
            <span>Don't have an account?</span>
            <a href="signup.html">Create new account</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
